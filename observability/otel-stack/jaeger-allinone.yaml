# Jaeger all-in-one — collector, agent, query UI, and in-memory storage in a
# single pod. For a quick side-by-side comparison with Tempo on the same
# OTel-emitted spans. In-memory storage means traces are lost on pod restart,
# which is fine for a comparison experiment.
#
# OTel Collector fans traces to both Tempo and this Jaeger instance. Open the
# UI via `kubectl port-forward svc/jaeger 16686:16686` or expose through Grafana
# as a datasource.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            # Enable OTLP ingress so OTel Collector can push spans directly.
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # In-memory storage — traces vanish on pod restart. Fine for the
            # comparison test; swap to Elasticsearch if we want persistence.
            - name: SPAN_STORAGE_TYPE
              value: "memory"
            - name: MEMORY_MAX_TRACES
              value: "50000"
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 10
