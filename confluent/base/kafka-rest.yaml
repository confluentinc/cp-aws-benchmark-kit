apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestProxy
metadata:
  name: kafkarestproxy
spec:
  replicas: 2
  image:
    application: confluentinc/cp-kafka-rest:8.3.1
    init: confluentinc/confluent-init-container:3.3.1
  dependencies:
    schemaRegistry:
      url: http://schemaregistry.$(NAMESPACE).svc.cluster.local:8081
    kafka:
      bootstrapEndpoint: kafka.$(NAMESPACE).svc.cluster.local:9071
      authentication:
        type: mtls
      tls:
        secretRef: client-tls-admin
  podTemplate:
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
